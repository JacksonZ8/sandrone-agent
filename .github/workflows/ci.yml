name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SANDRONE_TTS_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests (temporary SQLite, mock TTS, no local models)
        working-directory: backend
        run: |
          export SANDRONE_DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db"
          python -m unittest discover -s tests -t .
      - name: Import the app
        working-directory: backend
        run: SANDRONE_DATABASE_URL="sqlite:///$RUNNER_TEMP/import.db" python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
